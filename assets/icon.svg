<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="arrow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#52525b"/>
      <stop offset="1" stop-color="#3f3f46"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="#18181b"/>

  <!-- 墙 -->
  <rect x="226" y="92" width="60" height="328" rx="14" fill="url(#wall)"/>
  <g stroke="#18181b" stroke-width="7" stroke-linecap="round">
    <line x1="226" y1="152" x2="286" y2="152"/>
    <line x1="226" y1="212" x2="286" y2="212"/>
    <line x1="226" y1="300" x2="286" y2="300"/>
    <line x1="226" y1="360" x2="286" y2="360"/>
  </g>

  <!-- 双向箭头 -->
  <g>
    <rect x="96" y="234" width="320" height="44" rx="22" fill="url(#arrow)"/>
    <path d="M96 256 l70 -62 v124 z" fill="#22d3ee"/>
    <path d="M416 256 l-70 -62 v124 z" fill="#3b82f6"/>
  </g>

  <!-- 穿透处高光 -->
  <rect x="226" y="228" width="60" height="56" rx="10" fill="#0ea5e9" opacity="0.85"/>
  <rect x="236" y="238" width="40" height="36" rx="8" fill="#e0f2fe" opacity="0.9"/>
</svg>
