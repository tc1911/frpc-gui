[package]
name = "frpc-gui"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui = "0.2.2"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
ureq = { version = "2", features = ["tls"] }
flate2 = "1"
tar = "0.4"
unicode-segmentation = "1"

[target.'cfg(windows)'.dependencies]
zip = "2"

[build-dependencies]
winresource = "0.1"

[patch.crates-io]
xattr = { path = "vendor/xattr" }
proc-macro-error2 = { path = "vendor/proc-macro-error2" }

[profile.release]
lto = "thin"
strip = true
